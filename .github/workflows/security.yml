name: Security

on:
  workflow_call:
    inputs:
      src-paths:
        description: "Space-separated clj-kondo lint targets; nonexistent paths are skipped"
        type: string
        default: "src/clj src/cljs src/cljc"
      shellcheck-dir:
        description: "Directory to shellcheck; job self-skips if absent or empty"
        type: string
        default: "./bin"
      clj-watson-blocking:
        description: "Fail the workflow on clj-watson dependency-CVE findings (default: advisory only)"
        type: boolean
        default: false
      semgrep-blocking:
        description: "Fail the workflow on semgrep findings (default: advisory only)"
        type: boolean
        default: false
      zizmor-blocking:
        description: >-
          Fail the workflow on zizmor findings (default: advisory). Advisory by default
          because zizmor's default settings light up existing repos; blocking on
          adoption would wedge consumers.
        type: boolean
        default: false
      extra-rules-dir:
        description: "Consumer-supplied semgrep rules; added as an extra --config when the directory exists"
        type: string
        default: ".security-rules"
      rules-ref:
        description: >-
          Ref of cleancoders/github-actions to source detection rules from. Must match
          the ref this workflow is consumed at; a reusable workflow cannot determine
          its own ref.
        type: string
        default: "v1"
      ignored-paths:
        description: "Paths semgrep must skip (e.g. deliberately-vulnerable fixtures)"
        type: string
        default: ""
    secrets:
      private-git-ssh-key:
        description: >-
          SSH private (deploy) key for cloning private git dependencies while
          building the classpath. Only the classpath-building jobs (clj-kondo,
          clj-watson) use it; they self-skip SSH setup when it is unset, so consumers
          without private git deps can omit it. Scoped on purpose — do not reintroduce
          blanket `secrets: inherit`.
        required: false
      gh-api-token:
        description: >-
          GitHub API token for zizmor's online audits, which resolve every repository
          a workflow references with `uses:`. Optional: defaults to GITHUB_TOKEN, and
          when a referenced repository is unreadable the zizmor job degrades to
          offline audits rather than failing. Supply a token that can read every
          referenced repository to keep the online audits running.
        required: false

permissions:
  # contents: read only. `pull-requests: write` was here for clj-holmes-action,
  # which posted PR summary comments; that action is gone. Nothing left in this
  # workflow writes to a PR — semgrep emits SARIF to a file that goes up as an
  # artifact, gitleaks/actionlint/zizmor are plain binaries, and
  # action-shellcheck annotates via workflow commands, which needs no permission.
  #
  # This is not cosmetic: a reusable workflow cannot request more than its caller
  # grants, so a caller practising least privilege (`contents: read`) could not
  # call this workflow at all while it asked for pull-requests: write.
  contents: read

jobs:
  detect:
    # One tested place for every self-skip decision. Each scanner must skip
    # cleanly on a repo lacking the thing it scans, and a wrong answer means the
    # job silently skips while the build stays green — indistinguishable from
    # "scanned and found nothing".
    #
    # This used to be an inline `if [ -d ... ]` duplicated across jobs, which
    # could not be tested and drifted between copies. bin/detect.sh is covered by
    # bin/test-detect.sh (17 cases).
    runs-on: ubuntu-latest
    outputs:
      has-shellcheck-target: ${{ steps.d.outputs.has-shellcheck-target }}
      has-workflows: ${{ steps.d.outputs.has-workflows }}
      has-extra-rules: ${{ steps.d.outputs.has-extra-rules }}
      has-deps-edn: ${{ steps.d.outputs.has-deps-edn }}
      has-src-dirs: ${{ steps.d.outputs.has-src-dirs }}
      src-dirs: ${{ steps.d.outputs.src-dirs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check out cleancoders toolkit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: cleancoders/github-actions
          ref: ${{ inputs.rules-ref }}
          path: .cc-security-rules
          persist-credentials: false
      - name: Detect what this repo has
        id: d
        shell: bash
        env:
          SHELLCHECK_DIR: ${{ inputs.shellcheck-dir }}
          EXTRA_RULES_DIR: ${{ inputs.extra-rules-dir }}
          SRC_PATHS: ${{ inputs.src-paths }}
        run: |
          set -euo pipefail
          bash .cc-security-rules/bin/detect.sh outputs | tee -a "$GITHUB_OUTPUT"

  clj-kondo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up SSH for private git deps
        # Mirrors the consumer's build workflow: write the deploy key to
        # ~/.ssh/id_ed25519 so `clojure` can clone private git dependencies
        # while building the classpath. Self-skips when the secret is unset,
        # so repos without private git deps are unaffected.
        env:
          PRIVATE_GIT_SSH_KEY: ${{ secrets.private-git-ssh-key }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PRIVATE_GIT_SSH_KEY:-}" ]; then
            echo "::notice::no private-git-ssh-key provided; skipping SSH setup"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$PRIVATE_GIT_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a  # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Clojure + clj-kondo
        uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d  # v13.6.1 (node24)
        with:
          cli: 'latest'
          clj-kondo: 'latest'
      - name: Cache Clojure dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6 (node24)
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            ~/.clojure
          key: ${{ runner.os }}-clj-kondo-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-kondo-
            ${{ runner.os }}-clj-
      - name: Analyze dependency classpath (populate clj-kondo cache)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f deps.edn ]; then
            # Without a dependency-analysis pass, a bare `clj-kondo --lint src`
            # on a cold runner cannot resolve library macros (reagent with-let,
            # c3kit.wire, etc.) and false-flags every macro binding as an
            # unresolved symbol. Analyzing the classpath first populates the
            # cache so the src lint below matches local results. Best-effort:
            # dependency parse warnings must not fail the build.
            clj-kondo --lint "$(clojure -Spath)" --dependencies --copy-configs --skip-lint || true
          else
            echo "::notice::no deps.edn; skipping clj-kondo dependency analysis"
          fi
      - name: Lint existing source paths (fail on error level only)
        shell: bash
        env:
          SRC_PATHS: ${{ inputs.src-paths }}
        run: |
          set -euo pipefail
          read -ra requested <<< "$SRC_PATHS"
          paths=()
          for p in "${requested[@]}"; do
            [ -d "$p" ] && paths+=("$p")
          done
          if [ ${#paths[@]} -eq 0 ]; then
            echo "::notice::no source paths in '$SRC_PATHS' exist; skipping clj-kondo"
            exit 0
          fi
          echo "Linting: ${paths[*]}"
          clj-kondo --lint "${paths[@]}" --fail-level error

  shellcheck:
    needs: detect
    if: needs.detect.outputs.has-shellcheck-target == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38  # v2.0.0
        with:
          scandir: ${{ inputs.shellcheck-dir }}
          severity: error

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # full history — .gitleaksignore baselines the pre-redaction backlog
      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          VER=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: gitleaks (scan full history; new secrets fail, .gitleaksignore suppresses backlog)
        run: gitleaks git -v --redact .

  clj-watson:
    runs-on: ubuntu-latest
    # clj-watson ALWAYS runs with --fail-on-result, so any CVE turns this job
    # red and stays visible — you always know to look. continue-on-error
    # decides only whether that red BLOCKS the build: advisory (default)
    # surfaces the failure without blocking; clj-watson-blocking: true
    # propagates it and fails the build.
    continue-on-error: ${{ !inputs.clj-watson-blocking }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up SSH for private git deps
        # Mirrors the consumer's build workflow: write the deploy key to
        # ~/.ssh/id_ed25519 so `clojure` can clone private git dependencies
        # while building the classpath. Self-skips when the secret is unset,
        # so repos without private git deps are unaffected.
        env:
          PRIVATE_GIT_SSH_KEY: ${{ secrets.private-git-ssh-key }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${PRIVATE_GIT_SSH_KEY:-}" ]; then
            echo "::notice::no private-git-ssh-key provided; skipping SSH setup"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$PRIVATE_GIT_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a  # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Clojure Tools
        uses: DeLaGuardo/setup-clojure@4c7a6f613e5089821bb3bb2a33a3ee115578580d  # v13.6.1 (node24)
        with:
          cli: 'latest'
      - name: Cache Clojure dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6 (node24)
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            ~/.clojure
          key: ${{ runner.os }}-clj-watson-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clj-watson-
            ${{ runner.os }}-clj-
      - name: Dependency CVE scan
        # github-advisory strategy: queries GitHub Advisory DB (no NVD download,
        # no NVD API key). GITHUB_TOKEN is auto-provided by Actions.
        # --fail-on-result: any CVE exits non-zero so the job goes red. Whether
        # that blocks the build is the job-level continue-on-error above.
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f deps.edn ]; then
            echo "::notice::no deps.edn; skipping clj-watson"
            exit 0
          fi
          clojure -M:clj-watson scan -p deps.edn --database-strategy github-advisory --suggest-fix --fail-on-result

  semgrep:
    runs-on: ubuntu-latest
    # The ONLY Clojure scanner. clj-holmes was dropped: it read just .clj
    # (silently skipping .cljs and .cljc), was unmaintained since Oct 2022, and
    # cost three bugs — exiting 3 on zero findings with -t sarif, hiding findings
    # in a file, and crashing on a progress-bar int overflow that blocked a
    # production deploy. Its unique detections (read-string, clojure.xml XXE,
    # weak crypto, insecure TLS) are now cc-* rules that measurably outperform
    # it: 8 of 8 fixture cases versus its 6, and they cover .cljs/.cljc too.
    #
    # semgrep's weakness is that it cannot resolve namespace aliases, so each
    # rule enumerates them and spec-fixtures/ exercises more than one spelling —
    # see bin/test-rules.sh, which fails if that stops working.
    #
    # Two independent gates, easy to conflate:
    #
    #   1. WHICH findings turn this job red — decided by bin/report-sarif.sh,
    #      which exits 1 only on error-level results. semgrep is deliberately NOT
    #      run with --error: that gates on ANY finding regardless of severity,
    #      which would make cc-path-traversal, cc-generic-catch and
    #      cc-clojure-xml-xxe block builds despite being WARNING precisely so they
    #      do not. Findings suppressed in source with nosemgrep are excluded too.
    #
    #   2. Whether a red job BLOCKS the caller — decided by continue-on-error
    #      below. Advisory by default; semgrep-blocking: true propagates it.
    #
    # semgrep's own "Blocking" label in its console summary is its policy tag and
    # has no bearing on either gate.
    continue-on-error: ${{ !inputs.semgrep-blocking }}
    container:
      # Digest-pinned, not :latest. semgrep is now the ONLY Clojure detection
      # engine, so an unpinned image would let the thing that decides whether the
      # build is secure change underneath us. zizmor flags this as
      # unpinned-images (high).
      image: semgrep/semgrep@sha256:98c2572fced2474539fd27cab3207ebd8e95e4e7aab4c3b381fdc5e2641d9941  # latest @ 2026-07-22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check out cleancoders detection rules
        # A reusable workflow cannot reference files from its own repo: `uses: ./`
        # resolves against the CALLER's checkout, and GitHub exposes no reliable
        # "what ref am I running at" variable for reusable workflows. Hence an
        # explicit ref. A consumer on a non-v1 ref must set rules-ref to match.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: cleancoders/github-actions
          ref: ${{ inputs.rules-ref }}
          path: .cc-security-rules
          # cleancoders/github-actions is public, so no credential is needed to
          # read it — and not persisting one keeps it out of .git/config, which
          # this job's SARIF artifact upload would otherwise be able to carry.
          persist-credentials: false
      - name: Semgrep (cleancoders rules + OWASP Top 10 + default)
        shell: bash
        env:
          IGNORED: ${{ inputs.ignored-paths }}
          EXTRA_RULES_DIR: ${{ inputs.extra-rules-dir }}
        run: |
          set -euo pipefail
          # No --error here. With --sarif --output the findings go to the file and
          # the console gets only a count, so `--error` produced a red job whose
          # log said "Findings: 5" and nothing about WHAT or WHERE. We print them
          # from the SARIF below and set the exit code ourselves.
          args=(scan --sarif --output semgrep.sarif
                --config .cc-security-rules/security-rules/semgrep
                --config p/owasp-top-ten
                --config p/default)
          if [ -d "$EXTRA_RULES_DIR" ]; then
            echo "::notice::adding consumer rules from $EXTRA_RULES_DIR"
            args+=(--config "$EXTRA_RULES_DIR")
          fi
          # NOT `[ -n "$IGNORED" ] && args+=(...)`: that statement returns 1 when
          # the input is empty (the default), and `set -e` would exit here.
          if [ -n "$IGNORED" ]; then
            args+=(--exclude "$IGNORED")
          fi
          semgrep "${args[@]}"

          # Rendering and the exit decision live in bin/report-sarif.sh so both
          # are testable: bin/test-report-sarif.sh runs them against a SARIF
          # captured from a real consumer scan. The critical case it pins is that
          # warning-level rules do not block.
          bash .cc-security-rules/bin/report-sarif.sh semgrep.sarif
      - name: Upload SARIF
        if: always()   # evidence of a FAILING scan is the evidence most worth keeping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (node24)
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 90

  actionlint:
    needs: detect
    if: needs.detect.outputs.has-workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        # Hard-fails: this is workflow syntax and expression correctness, not
        # opinion. Catches broken ${{ }} refs and shell bugs inside run: blocks.
        shell: bash
        run: |
          set -euo pipefail
          VER=1.7.12
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${VER}/actionlint_${VER}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin actionlint
          actionlint

  zizmor:
    needs: detect
    if: needs.detect.outputs.has-workflows == 'true'
    runs-on: ubuntu-latest
    # Advisory by default: zizmor's default settings light up existing repos, so
    # blocking on adoption would wedge every consumer on day one. Covers OWASP
    # A02 Security Misconfiguration and A03 Supply Chain — CI config is itself
    # attack surface, and this repo's entire product is workflows.
    continue-on-error: ${{ !inputs.zizmor-blocking }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the runner script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: cleancoders/github-actions
          ref: ${{ inputs.rules-ref }}
          path: .cc-security-rules
          persist-credentials: false
      - name: zizmor
        # Prebuilt binary rather than `uvx` via setup-uv. setup-uv tries to cache
        # Python project dependencies and warns on every run of a Clojure repo:
        #   "No file matched to [**/requirements*.txt, **/pyproject.toml, ...]
        #    The cache will never get invalidated."
        # There is nothing to cache — we run one tool once, we are not installing
        # a Python project — so the whole action was noise. This also matches how
        # gitleaks and actionlint are installed in this workflow.
        shell: bash
        env:
          # Falls back to GITHUB_TOKEN, which reaches only the repository being
          # scanned. That is enough for the online audits unless a workflow here
          # references a repository the token cannot read — see run-zizmor.sh.
          GH_TOKEN: ${{ secrets.gh-api-token || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=1.28.0
          curl -fsSL "https://github.com/zizmorcore/zizmor/releases/download/v${VER}/zizmor-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar -xz -C /usr/local/bin zizmor
          zizmor --version
          # Stage the script out of the workspace and drop the checkout before
          # scanning. zizmor is pointed at "." and actions/checkout can only write
          # inside the workspace, so leaving .cc-security-rules in place would put
          # THIS repo's workflows into the consumer's scan — findings attributed to
          # a build that does not own the file, and with zizmor-blocking a failure
          # the consumer cannot fix. Keeps the scan scope identical to before the
          # script was introduced.
          cp .cc-security-rules/bin/run-zizmor.sh "$RUNNER_TEMP/"
          rm -rf .cc-security-rules
          bash "$RUNNER_TEMP/run-zizmor.sh" zizmor.sarif .
      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1 (node24)
        with:
          name: zizmor-sarif
          path: zizmor.sarif
          retention-days: 90
