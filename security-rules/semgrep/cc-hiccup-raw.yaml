rules:
  - id: cc-hiccup-raw
    languages: [clojure]
    severity: ERROR
    message: >-
      hiccup.util/raw-string and hiccup.core/raw bypass Hiccup's auto-escaping. If
      the value is user-controlled this is stored or reflected XSS. Sanitize with
      the OWASP Java HTML Sanitizer, or drop the raw call and let Hiccup escape.
      This rule has no dataflow: it also fires on a raw call whose argument is a
      compile-time constant, which is safe. Trace provenance before acting — see
      the hiccup-injection class in the clojure-security skill.
    metadata:
      cwe: ["CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"]
      owasp: ["A05:2025 - Injection"]
      class: hiccup-injection
      confidence: HIGH
      references:
        - https://owasp.org/Top10/2025/A05_2025-Injection/
    pattern-either:
      # semgrep cannot resolve namespace aliases, so enumerate them. Fully
      # qualified first, then the aliases seen across the cleancoders repos.
      - pattern: (hiccup.util/raw-string $X)
      - pattern: (hu/raw-string $X)
      - pattern: (html/raw-string $X)
      - pattern: (util/raw-string $X)
      - pattern: (hiccup.core/raw $X)
      - pattern: (h/raw $X)
      - pattern: (hiccup/raw $X)
